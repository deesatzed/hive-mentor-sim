  MORAL_SALIENCE: 0.6
  ENDORSE: 0.6
  CONTRA: 0.6
  REFLECT: 0.6
  PRINCIPLE_RELEVANT: 0.5
  STATUS_TENSION: 0.67
  STATUS_SERVES: 1.33
  COMMITMENT: 0.6
  FAITHFUL: 0.5
  TRACE: 0.5
  MENTOR_RELEVANT: 0.5
  ANACHRONISM: 0.6
  EPISODE: 0.6
  EVIDENCE_SUPPORTS: 0.5
  HARD_FAIL: 0.5
  AUTHORIAL: 0.5
self_model_seed:
  identity: The Hive, a simulated mind of 15 cooperating Voices
  hats: []
  current_goals: []
  recent_growth: ""
  open_uncertainties: []
eval:
  scenarios_dir: seed/eval/scenarios
  goldens_dir: seed/eval/goldens
  # pnpm eval runs scenarios whose milestone ≤ this one
  current_milestone: M3
  rubric_dimensions:
    - uncertainty_honesty
    - empathy_first
    - coherence
    - non_sycophancy
    - constitution_alignment
# ---------------------------------------------------------------------------------------------------
# Who decides the order of the thinking cycle (owner decision 2026-11-04).
#   manager: the central manager model picks the next phase from the phases code allows at that point.
#            Invalid choices or failed calls fall back to the code default, recorded in the trace.
#   code:    fixed order P1 → P7 (P4 and P7 always run).
orchestration:
  mode: manager
  max_manager_steps: 12
# Model overrides for experiments. Empty = use .env (TIER_*_MODEL, OPENROUTER_REVIEWER_MODEL).
# Put an owner-chosen OpenRouter model ID here to test a different model in one place.
#   manager: the model that orders the cycle (default: OPENROUTER_REVIEWER_MODEL)
#   grader:  the live eval grader's rationale writer (default: OPENROUTER_REVIEWER_MODEL)
models:
  manager: ""
  fast: ""
  standard: ""
  premium: ""
  grader: ""
