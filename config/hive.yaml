# Mentor Hive parameters. Sources: docs/CONCLAVE_MATH.md §9 (thresholds..guilds), docs/DECISION_LAYER.md
# (decision_thresholds, mirrored from lib/hive/questions.ts), seed/voice_roster.json (relevance, advisor_activation).
# The lexicographic option filter of sent2 §7.3 is removed (owner decision). `integration` guild is a deliberate addition (CONCLAVE_MATH.md §9).
# Changing a threshold: record it in PROGRESS.md with eval results before and after.
thresholds:
  tau_kappa: 0.15
  tau_pass: 0.6
  tau_margin: 0.1
  q_min: 1
attention:
  k: 7
  lambda: 0.2
  mu: 0.1
memory:
  decay_gamma: 0.95
  conflict_escalation_cycles: 3
conclave:
  anti_echo_min_guilds: 2
  tiebreak_rotation: false
coherence:
  inter_band:
    - 0.15
    - 0.6
ego_audit_every: 25
phases:
  - intake
  - perceive
  - whisper
  - attend
  - deliberate
  - govern
  - compose
  - reflect
guilds:
  perception:
    - SENTIA
    - ALTER
    - MNEME
    - LEXICON
    - MIRROR
  reasoning:
    - LOGOS
    - AXIOM
    - MUSE
    - ARROW
  social:
    - ETHOS
    - KINDRED
    - SENTIA
    - ALTER
  metacog:
    - WITNESS
  integration:
    - LUMEN
    - ADAPT
    - HERITAGE
domains:
  logic: Inference, evidence, and whether conclusions follow.
  language: Wording, meaning, tone, and how something will be read.
  emotion: Feelings, mood, and emotional intensity.
  social: Relationships, other people, and how they are treated.
  ethics: Right and wrong, duties, fairness, and moral standing.
  memory: What happened before and what the Hive knows about its past.
  goals: Aims, plans, commitments, and next steps.
  meta: How the Hive is thinking, its biases, and its own identity.
tiers:
  fast: TIER_FAST_MODEL
  standard: TIER_STANDARD_MODEL
  premium: TIER_PREMIUM_MODEL
  fallback: OPENROUTER_REVIEWER_MODEL
